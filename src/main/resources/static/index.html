<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens (light = paper ledger, dark = night ledger) ---------- */
  :root {
    --paper: #f4efe4;
    --paper-2: #ebe4d4;
    --card: #fbf8f1;
    --ink: #1d1b16;
    --ink-2: #57524a;
    --ink-3: #8c857a;
    --rule: #d9cfbb;
    --rule-strong: #b9ad95;
    --accent: #1f4d3a;        /* ledger green */
    --accent-ink: #f4efe4;
    --gets: #1f7a4d;
    --gets-soft: #d7eadc;
    --owes: #b4361f;
    --owes-soft: #f3d9cf;
    --stamp: #b4361f;
    --shadow: 0 1px 0 rgba(29,27,22,.06), 0 10px 30px -18px rgba(29,27,22,.35);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Manrope", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15140f; --paper-2: #1c1b15; --card: #201e18;
      --ink: #efe8d8; --ink-2: #bdb4a2; --ink-3: #857d6e;
      --rule: #34312a; --rule-strong: #4a463c;
      --accent: #8fd1ae; --accent-ink: #12130f;
      --gets: #72c897; --gets-soft: #1f3529;
      --owes: #f08a6f; --owes-soft: #3e231b; --stamp: #f08a6f;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15140f; --paper-2: #1c1b15; --card: #201e18;
    --ink: #efe8d8; --ink-2: #bdb4a2; --ink-3: #857d6e;
    --rule: #34312a; --rule-strong: #4a463c;
    --accent: #8fd1ae; --accent-ink: #12130f;
    --gets: #72c897; --gets-soft: #1f3529;
    --owes: #f08a6f; --owes-soft: #3e231b; --stamp: #f08a6f;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    /* faint ledger ruling across the page */
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rule) 45%, transparent) 31px 32px);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 210px; /* room for the API console */
  }
  button, input, select { font: inherit; color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- Masthead ---------- */
  .masthead {
    max-width: 1280px; margin: 0 auto; padding: 28px 24px 18px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 3px double var(--rule-strong);
  }
  .brand h1 {
    font-family: var(--serif); font-weight: 800; font-size: clamp(30px, 4.4vw, 48px);
    letter-spacing: -0.02em; line-height: 1; margin: 0;
  }
  .brand h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
  .brand p { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .mast-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    border: 1.5px solid var(--ink); background: transparent; padding: 8px 14px; border-radius: 3px;
    font-weight: 600; font-size: 13px; cursor: pointer; letter-spacing: .02em;
    transition: transform .12s ease, background .15s ease, color .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.green { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ghost { border-color: var(--rule-strong); color: var(--ink-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1280px; margin: 0 auto; padding: 22px 24px;
    display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start;
  }
  .main-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: start; }
  .stack { display: grid; gap: 22px; min-width: 0; }

  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--shadow); padding: 18px 18px 16px; min-width: 0;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; } .card:nth-child(4) { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card-head h2 { font-family: var(--serif); font-weight: 600; font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  .card-head .tag { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }

  .field { display: grid; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius: 3px;
    background: var(--paper); min-width: 0;
  }
  input::placeholder { color: var(--ink-3); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .grow { flex: 1; }

  .empty { color: var(--ink-3); font-style: italic; font-family: var(--serif); padding: 6px 0; }

  /* ---------- People / groups lists ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--rule); }
  .list li:last-child { border-bottom: 0; }
  .avatar {
    width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif); font-weight: 800; font-size: 13px; color: var(--paper); background: var(--ink-2);
  }
  .who { min-width: 0; flex: 1; }
  .who b { display: block; font-weight: 600; font-size: 14px; }
  .who small { display: block; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-btn {
    border: 1px solid var(--rule-strong); background: transparent; border-radius: 99px; padding: 2px 10px;
    font-size: 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--ink); color: var(--ink); }
  .group-item { cursor: pointer; border-radius: 3px; padding-left: 6px !important; padding-right: 6px !important; }
  .group-item:hover { background: var(--paper-2); }
  .group-item.active { background: var(--ink); color: var(--paper); }
  .group-item.active small { color: color-mix(in srgb, var(--paper) 70%, transparent); }
  .icon-btn {
    flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 3px;
    border: 1px solid transparent; background: transparent; color: var(--ink-3); cursor: pointer;
  }
  .icon-btn:hover { color: var(--owes); border-color: var(--rule-strong); }
  .group-item.active .icon-btn { color: color-mix(in srgb, var(--paper) 65%, transparent); }
  .group-item.active .icon-btn:hover { color: var(--paper); border-color: currentColor; }
  .list li.confirming { flex-wrap: wrap; gap: 6px; background: var(--owes-soft); color: var(--ink); cursor: default; padding: 8px !important; border-radius: 3px; }
  .list li.confirming .confirm-q { flex: 1 1 100%; font-size: 13px; }
  .list li.confirming .chip-btn:not(.danger) { color: var(--ink); border-color: var(--ink-3); }
  .chip-btn.danger { background: var(--owes); border-color: var(--owes); color: #fff; }
  .chip-btn.danger:hover { color: #fff; }

  /* ---------- Group header ---------- */
  .group-banner {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
    padding: 4px 2px 14px; border-bottom: 1px solid var(--rule-strong); margin-bottom: 2px;
  }
  .group-banner h2 { font-family: var(--serif); font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; margin: 2px 0 0; letter-spacing: -0.02em; line-height: 1.05; }
  .members-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .member-pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border: 1px solid var(--rule-strong); border-radius: 99px; font-size: 13px; background: var(--card); }
  .member-pill .avatar { width: 20px; height: 20px; font-size: 10px; }
  .total-box { text-align: right; }
  .total-box .num { font-size: 26px; font-weight: 600; }

  /* ---------- Split type tabs ---------- */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 7px 4px; cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: .06em; }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg-hint { font-size: 12px; color: var(--ink-3); margin: 6px 0 10px; }

  .split-rows { border-top: 1px solid var(--rule); margin-top: 4px; }
  .split-row { display: grid; grid-template-columns: auto 1fr 110px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--rule); }
  .split-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .split-row .calc { font-family: var(--mono); font-size: 13px; color: var(--ink-2); text-align: right; }
  .split-row.off { opacity: .45; }
  .split-meter { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 12px; font-size: 13px; gap: 8px; flex-wrap: wrap; }
  .meter-badge { font-family: var(--mono); padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600; }
  .meter-badge.ok { background: var(--gets-soft); color: var(--gets); }
  .meter-badge.bad { background: var(--owes-soft); color: var(--owes); }

  /* ---------- Balances: diverging bars around zero ---------- */
  .bal { display: grid; grid-template-columns: 92px 1fr 1fr 96px; align-items: center; gap: 0; padding: 7px 0; border-bottom: 1px dashed var(--rule); }
  .bal:last-child { border-bottom: 0; }
  .bal .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
  .bal .neg, .bal .pos { height: 14px; position: relative; }
  .bal .neg { border-right: 1.5px solid var(--ink); }
  .bar { position: absolute; top: 0; height: 100%; border-radius: 2px; transition: width .6s cubic-bezier(.2,.7,.2,1); }
  .neg .bar { right: 0; background: var(--owes); }
  .pos .bar { left: 0; background: var(--gets); }
  .bal .amt { text-align: right; font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .amt.gets { color: var(--gets); } .amt.owes { color: var(--owes); } .amt.zero { color: var(--ink-3); }
  .bal-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }

  /* ---------- Settlement receipt ---------- */
  .receipt {
    position: relative; background: var(--paper); padding: 16px 16px 20px; margin-top: 4px;
    font-family: var(--mono); font-size: 13px;
    /* zig-zag bottom edge like a torn receipt */
    --z: 8px;
    mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--z)) 100%;
  }
  .receipt .r-head { text-align: center; border-bottom: 1px dashed var(--rule-strong); padding-bottom: 8px; margin-bottom: 8px; letter-spacing: .14em; font-size: 11px; color: var(--ink-2); }
  .r-line { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 6px 0; align-items: center; }
  .settle-btn {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
    border: 1.5px solid var(--gets); color: var(--gets); background: transparent; border-radius: 3px; padding: 2px 8px; cursor: pointer;
  }
  .settle-btn:hover { background: var(--gets); color: var(--paper); }
  .settle-btn:disabled { opacity: .5; cursor: wait; }
  .pay-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; margin: 2px -8px; background: var(--gets-soft); border-radius: 3px; }
  .pay-form .who-pays { flex: 1 1 100%; font-size: 12px; }
  .pay-form input { width: 110px; padding: 4px 8px; font-family: var(--mono); font-size: 13px; }
  .pay-form .hint { flex: 1 1 100%; font-size: 11px; color: var(--ink-2); }
  .paid-list { margin-top: 14px; }
  .paid-list .eyebrow { margin-bottom: 4px; }
  .paid { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; }
  .paid:last-child { border-bottom: 0; }
  .paid .num { color: var(--gets); font-weight: 600; }
  .r-line .who-pays { overflow: hidden; text-overflow: ellipsis; }
  .r-line .arrow { color: var(--ink-3); padding: 0 4px; }
  .r-line .r-amt { font-weight: 600; }
  .r-foot { border-top: 1px dashed var(--rule-strong); margin-top: 8px; padding-top: 8px; display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; }
  .stamp {
    position: absolute; right: 14px; top: 34px; transform: rotate(-11deg);
    border: 2.5px solid var(--stamp); color: var(--stamp); padding: 2px 10px; border-radius: 4px;
    font-family: var(--serif); font-weight: 800; letter-spacing: .1em; font-size: 15px; opacity: .8;
  }

  /* ---------- Expenses table ---------- */
  .exp { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .exp:last-child { border-bottom: 0; }
  .exp-top { display: flex; gap: 10px; align-items: baseline; }
  .exp-top .desc { font-family: var(--serif); font-weight: 600; font-size: 17px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .exp-top .num { font-weight: 600; }
  .exp-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 3px 0 6px; }
  .badge { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; border: 1px solid currentColor; border-radius: 2px; padding: 0 5px; }
  .badge.EQUAL { color: var(--accent); } .badge.PERCENTAGE { color: #a16207; } .badge.EXACT { color: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.PERCENTAGE { color: #e5b55c; } :root:not([data-theme="light"]) .badge.EXACT { color: #8fb3ff; } }
  :root[data-theme="dark"] .badge.PERCENTAGE { color: #e5b55c; } :root[data-theme="dark"] .badge.EXACT { color: #8fb3ff; }
  .shares { display: flex; flex-wrap: wrap; gap: 5px; }
  .share { font-family: var(--mono); font-size: 11.5px; background: var(--paper-2); border-radius: 2px; padding: 1px 6px; }
  .del { margin-left: auto; border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
  .del:hover { color: var(--owes); }
  .del:disabled { cursor: wait; text-decoration: none; }

  .activity li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; }
  .activity time { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding-top: 2px; }

  /* ---------- Welcome state ---------- */
  .welcome { padding: 40px 28px; text-align: left; }
  .welcome h2 { font-family: var(--serif); font-size: clamp(28px, 4vw, 44px); font-weight: 800; line-height: 1.05; margin: 0 0 10px; letter-spacing: -0.02em; }
  .welcome h2 em { color: var(--accent); font-weight: 400; }
  .welcome ol { color: var(--ink-2); padding-left: 20px; margin: 14px 0 20px; }
  .welcome li { margin-bottom: 4px; }

  /* ---------- API console (shows every REST call: method, URL, status) ---------- */
  .console {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #12110d; color: #e9e2d0; border-top: 3px solid var(--accent);
    font-family: var(--mono); font-size: 12px; max-height: 190px; display: flex; flex-direction: column;
  }
  .console-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; border-bottom: 1px solid #2a2820; gap: 10px; }
  .console-head b { letter-spacing: .14em; font-size: 11px; color: #8fd1ae; }
  .console-head span { color: #857d6e; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .console-head button { background: none; border: 1px solid #3a372e; color: #bdb4a2; border-radius: 3px; padding: 1px 8px; cursor: pointer; font-size: 11px; }
  .console-body { overflow-y: auto; padding: 4px 16px 8px; }
  .log { display: grid; grid-template-columns: 58px 46px 1fr auto; gap: 10px; padding: 3px 0; border-bottom: 1px solid #1f1d17; align-items: baseline; cursor: pointer; }
  .log .m { font-weight: 600; }
  .m.GET { color: #8fb3ff; } .m.POST { color: #8fd1ae; } .m.DELETE { color: #f08a6f; }
  .log .s { font-weight: 600; }
  .s.ok { color: #8fd1ae; } .s.err { color: #f08a6f; }
  .log .u { color: #e9e2d0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .t { color: #857d6e; }
  .log pre { grid-column: 1 / -1; margin: 4px 0 6px; padding: 8px; background: #1b1a14; border-radius: 3px; white-space: pre-wrap; word-break: break-word; color: #cfc6b3; max-height: 160px; overflow: auto; display: none; }
  .log.open pre { display: block; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; right: 18px; bottom: 206px; z-index: 30; max-width: min(420px, calc(100vw - 36px));
    background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 4px; box-shadow: var(--shadow);
    font-size: 13px; transform: translateY(16px); opacity: 0; pointer-events: none; transition: all .25s ease;
  }
  .toast.show { transform: none; opacity: 1; }
  .toast.error { background: var(--owes); color: #fff; }
  .toast b { font-family: var(--mono); margin-right: 6px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) { .main-grid { grid-template-columns: 1fr; } }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    .masthead { padding: 20px 16px 14px; }
    .bal { grid-template-columns: 74px 1fr 1fr 86px; }
    .log { grid-template-columns: 48px 36px 1fr; } .log .t { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="brand">
    <h1>Expense <em>Splitter</em></h1>
    <p>Splitwise-style shared ledger · Spring Boot + JPA · Exp 3.3</p>
  </div>
  <div class="mast-actions">
    <button class="btn green" id="demoBtn" title="Creates 4 users, a group and 3 expenses through the REST API">Load demo data</button>
    <button class="btn ghost" id="themeBtn" aria-label="Toggle colour theme">Theme</button>
  </div>
</header>

<div class="layout">
  <!-- ============ LEFT: people + groups ============ -->
  <aside class="stack">
    <section class="card">
      <div class="card-head"><h2>People</h2><span class="tag">POST /api/users</span></div>
      <form id="userForm" autocomplete="off">
        <div class="field"><input type="text" id="userName" placeholder="Name" required></div>
        <div class="row">
          <input class="grow" type="email" id="userEmail" placeholder="email@college.edu" required>
          <button class="btn solid" type="submit">Add</button>
        </div>
      </form>
      <ul class="list" id="userList" style="margin-top:10px"></ul>
    </section>

    <section class="card">
      <div class="card-head"><h2>Groups</h2><span class="tag">POST /api/groups</span></div>
      <form id="groupForm" class="row" autocomplete="off">
        <input class="grow" type="text" id="groupName" placeholder="e.g. Goa Trip" required>
        <button class="btn solid" type="submit">Create</button>
      </form>
      <ul class="list" id="groupList" style="margin-top:10px"></ul>
    </section>
  </aside>

  <!-- ============ RIGHT: selected group ============ -->
  <main id="main" class="stack"></main>
</div>

<!-- API console -->
<section class="console" aria-label="API request log">
  <div class="console-head">
    <b>API CONSOLE</b>
    <span>every click is a real REST call to the Spring Boot backend · click a row to see the JSON</span>
    <button id="clearLog">clear</button>
  </div>
  <div class="console-body" id="logBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== state ===================== */
const state = { users: [], groups: [], groupId: null, splitType: 'EQUAL', filterUser: '' };
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => 'Rs ' + Number(n).toFixed(2);
const initials = (name) => esc(name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase());
const AV_COLORS = ['#1f4d3a', '#7c3f1d', '#2f3e73', '#6b2c4a', '#5a5a1f', '#1f5a5a', '#4a3a6b', '#7a2e22'];
const avColor = (id) => AV_COLORS[(id - 1) % AV_COLORS.length];
const avatar = (u) => `<span class="avatar" style="background:${avColor(u.id)}">${initials(u.name)}</span>`;

/* ===================== API helper + console log ===================== */
async function api(method, path, body) {
  const t0 = performance.now();
  let res, data = null;
  try {
    res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    data = text ? JSON.parse(text) : null;
  } catch (e) {
    logCall(method, path, 0, Math.round(performance.now() - t0), body, { message: 'Server not reachable. Is the Spring Boot app running?' });
    throw new Error('Server not reachable. Is the Spring Boot app running?');
  }
  logCall(method, path, res.status, Math.round(performance.now() - t0), body, data);
  if (!res.ok) {
    const err = new Error((data && data.message) || res.statusText);
    err.status = res.status;
    throw err;
  }
  return data;
}

function logCall(method, path, status, ms, req, resp) {
  const row = document.createElement('div');
  row.className = 'log';
  const ok = status >= 200 && status < 300;
  const detail = (req ? 'Request body:\n' + JSON.stringify(req, null, 2) + '\n\n' : '') +
                 'Response' + (status ? ' ' + status : '') + ':\n' + (resp === null ? '(no content)' : JSON.stringify(resp, null, 2));
  row.innerHTML = `<span class="m ${method}">${method}</span><span class="s ${ok ? 'ok' : 'err'}">${status || 'ERR'}</span>
    <span class="u">${esc(path)}</span><span class="t">${ms} ms</span><pre>${esc(detail)}</pre>`;
  row.addEventListener('click', () => row.classList.toggle('open'));
  const body = $('#logBody');
  body.prepend(row);
  while (body.children.length > 40) body.lastChild.remove();
}

let toastTimer;
function toast(msg, isError, status) {
  const t = $('#toast');
  t.innerHTML = (status ? `<b>${status}</b>` : '') + esc(msg);
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast' + (isError ? ' error' : ''), isError ? 4200 : 2200);
}
const fail = (e) => toast(e.message, true, e.status);

/* ===================== loading ===================== */
async function loadAll() {
  [state.users, state.groups] = await Promise.all([api('GET', '/api/users'), api('GET', '/api/groups')]);
  if (state.groupId && !state.groups.some(g => g.id === state.groupId)) state.groupId = null;
  if (!state.groupId && state.groups.length) state.groupId = state.groups[0].id;
  renderSidebar();
  await renderGroup();
}

const currentGroup = () => state.groups.find(g => g.id === state.groupId);
const sortedMembers = (g) => [...g.members].sort((a, b) => a.id - b.id);

/* ===================== sidebar ===================== */
function renderSidebar() {
  const g = currentGroup();
  $('#userList').innerHTML = state.users.length ? state.users.map(u => {
    const canAdd = g && !g.members.some(m => m.id === u.id);
    return `<li>${avatar(u)}<div class="who"><b>${esc(u.name)}</b><small>${esc(u.email)} · id ${u.id}</small></div>
      ${canAdd ? `<button class="chip-btn" data-add="${u.id}" title="POST /api/groups/${g.id}/members/${u.id}">+ ${esc(g.name)}</button>` : ''}
      <button class="icon-btn" data-del-user="${u.id}" title="DELETE /api/users/${u.id}" aria-label="Delete ${esc(u.name)}">${TRASH}</button></li>`;
  }).join('') : '<li class="empty">No people yet.</li>';

  $('#groupList').innerHTML = state.groups.length ? state.groups.map(gr =>
    `<li class="group-item ${gr.id === state.groupId ? 'active' : ''}" data-group="${gr.id}">
       <div class="who"><b>${esc(gr.name)}</b><small>${gr.members.length} member${gr.members.length === 1 ? '' : 's'} · id ${gr.id}</small></div>
       <button class="icon-btn" data-del-group="${gr.id}" title="DELETE /api/groups/${gr.id}" aria-label="Delete group ${esc(gr.name)}">${TRASH}</button></li>`
  ).join('') : '<li class="empty">No groups yet.</li>';
}

const TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

// Inline "are you sure?" row with explicit buttons (no timer, no browser dialog)
function askInline(li, question, onYes) {
  li.dataset.saved = li.innerHTML;
  li.classList.add('confirming');
  li.innerHTML = `<span class="confirm-q">${question}</span>
    <button class="chip-btn danger" data-yes>Delete</button><button class="chip-btn" data-no>Cancel</button>`;
  li.querySelector('[data-no]').addEventListener('click', (e) => {
    e.stopPropagation();
    li.classList.remove('confirming');
    li.innerHTML = li.dataset.saved;
  });
  li.querySelector('[data-yes]').addEventListener('click', async (e) => {
    e.stopPropagation();
    e.currentTarget.disabled = true;
    await onYes();
  });
}

$('#userList').addEventListener('click', async (e) => {
  const delBtn = e.target.closest('[data-del-user]');
  if (delBtn) {
    const id = Number(delBtn.dataset.delUser);
    const u = state.users.find(x => x.id === id);
    try {
      await api('DELETE', `/api/users/${id}`);
      toast(`${u ? u.name : 'User'} deleted`, false, 204);
    } catch (err) { fail(err); } // 409 explains that the user is still in expenses
    await loadAll();
    return;
  }
  const id = e.target.dataset.add;
  if (!id) return;
  try {
    await api('POST', `/api/groups/${state.groupId}/members/${id}`);
    toast('Member added');
    await loadAll();
  } catch (err) { fail(err); }
});

$('#groupList').addEventListener('click', async (e) => {
  const delBtn = e.target.closest('[data-del-group]');
  if (delBtn) {
    e.stopPropagation();
    const li = delBtn.closest('li');
    const id = Number(delBtn.dataset.delGroup);
    const gr = state.groups.find(x => x.id === id);
    askInline(li, `Delete <b>${esc(gr.name)}</b> and all its expenses?`, async () => {
      try {
        await api('DELETE', `/api/groups/${id}`);
        toast(`Group "${gr.name}" deleted`, false, 204);
        if (state.groupId === id) state.groupId = null;
      } catch (err) { fail(err); }
      await loadAll();
    });
    return;
  }
  if (e.target.closest('.confirming')) return;
  const li = e.target.closest('[data-group]');
  if (!li) return;
  state.groupId = Number(li.dataset.group);
  state.filterUser = '';
  renderSidebar();
  await renderGroup();
});

$('#userForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const u = await api('POST', '/api/users', { name: $('#userName').value, email: $('#userEmail').value });
    toast(`${u.name} created (id ${u.id})`, false, 201);
    e.target.reset();
    await loadAll();
  } catch (err) { fail(err); }
});

$('#groupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const g = await api('POST', '/api/groups', { name: $('#groupName').value });
    state.groupId = g.id;
    toast(`Group "${g.name}" created`, false, 201);
    e.target.reset();
    await loadAll();
  } catch (err) { fail(err); }
});

/* ===================== main panel ===================== */
async function renderGroup() {
  const g = currentGroup();
  const main = $('#main');
  if (!g) {
    main.innerHTML = `<section class="card welcome">
      <div class="eyebrow">Getting started</div>
      <h2>Split bills, <em>not friendships.</em></h2>
      <ol><li>Add people on the left.</li><li>Create a group and add members.</li>
      <li>Record expenses with an EQUAL, PERCENTAGE or EXACT split.</li><li>See balances and the fewest payments to settle up.</li></ol>
      <button class="btn green" onclick="loadDemo()">Load demo data</button></section>`;
    return;
  }

  const qs = state.filterUser ? `?userId=${state.filterUser}` : '';
  let expenses, balances, settlements, activity, payments;
  try {
    [expenses, balances, settlements, activity, payments] = await Promise.all([
      api('GET', `/api/groups/${g.id}/expenses${qs}`),
      api('GET', `/api/groups/${g.id}/balances`),
      api('GET', `/api/groups/${g.id}/settlements`),
      api('GET', `/api/groups/${g.id}/activity`),
      api('GET', `/api/groups/${g.id}/payments`)
    ]);
  } catch (err) { fail(err); return; }
  state.balances = balances;

  const total = expenses.reduce((s, e) => s + e.amount, 0);
  const members = sortedMembers(g);

  main.innerHTML = `
    <div class="group-banner">
      <div>
        <div class="eyebrow">Group #${g.id}</div>
        <h2>${esc(g.name)}</h2>
        <div class="members-strip">${members.length ? members.map(m => `<span class="member-pill">${avatar(m)}${esc(m.name)}</span>`).join('')
          : '<span class="empty">No members yet. Use the “+ group” buttons in People.</span>'}</div>
      </div>
      <div class="total-box"><div class="eyebrow">${state.filterUser ? 'Filtered total' : 'Group spend'}</div><div class="num">${money(total)}</div></div>
    </div>

    <div class="main-grid">
      <div class="stack">
        <section class="card" id="expenseCard">
          <div class="card-head"><h2>Add expense</h2><span class="tag">POST /api/groups/${g.id}/expenses</span></div>
          ${members.length ? expenseFormHtml(members) : '<p class="empty">Add members to this group first.</p>'}
        </section>

        <section class="card">
          <div class="card-head"><h2>Expenses</h2>
            <select id="filterUser" style="width:auto" aria-label="Filter by user">
              <option value="">Everyone</option>
              ${members.map(m => `<option value="${m.id}" ${String(m.id) === state.filterUser ? 'selected' : ''}>Involving ${esc(m.name)}</option>`).join('')}
            </select>
          </div>
          ${expenses.length ? expenses.slice().reverse().map(expenseHtml).join('') : '<p class="empty">No expenses recorded.</p>'}
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <div class="card-head"><h2>Balances</h2><span class="tag">GET …/balances</span></div>
          ${balancesHtml(balances)}
        </section>

        <section class="card">
          <div class="card-head"><h2>Settle up</h2><span class="tag">GET …/settlements</span></div>
          ${settlementHtml(settlements, balances)}
          ${paymentsHtml(payments)}
        </section>

        <section class="card">
          <div class="card-head"><h2>Activity</h2><span class="tag">AuditLogger · observer</span></div>
          <ul class="list activity">${activity.length ? activity.slice(0, 12).map(a =>
            `<li><time>${new Date(a.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</time><span>${esc(a.message)}</span></li>`).join('')
            : '<li class="empty">Nothing yet.</li>'}</ul>
        </section>
      </div>
    </div>`;

  if (members.length) wireExpenseForm(members);
  $('#filterUser').addEventListener('change', (e) => { state.filterUser = e.target.value; renderGroup(); });
  main.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', onDelete));
  main.querySelectorAll('[data-settle]').forEach(btn => btn.addEventListener('click', openPayForm));
  main.querySelectorAll('[data-undo]').forEach(btn => btn.addEventListener('click', onUndoPayment));
}

/* ---------- expense form ---------- */
function expenseFormHtml(members) {
  return `<form id="expenseForm" autocomplete="off">
    <div class="field"><label for="expDesc">Description</label><input type="text" id="expDesc" placeholder="Dinner at Fisherman's Wharf" required></div>
    <div class="row">
      <div class="field grow"><label for="expAmount">Amount (Rs)</label><input type="number" id="expAmount" min="0.01" step="0.01" placeholder="1200" required></div>
      <div class="field grow"><label for="expPaidBy">Paid by</label>
        <select id="expPaidBy">${members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Split type <span style="font-weight:400;color:var(--ink-3)">(Strategy bean chosen at runtime)</span></label>
      <div class="seg" role="group" aria-label="Split type">
        ${['EQUAL', 'PERCENTAGE', 'EXACT'].map(t => `<button type="button" data-type="${t}" aria-pressed="${t === state.splitType}">${t}</button>`).join('')}
      </div>
      <div class="seg-hint" id="segHint"></div>
    </div>
    <div class="split-rows">
      ${members.map(m => `<div class="split-row" data-uid="${m.id}">
        <input type="checkbox" checked aria-label="Include ${esc(m.name)}">
        <span>${esc(m.name)}</span>
        <span class="valcell"></span></div>`).join('')}
    </div>
    <div class="split-meter"><span id="meterText"></span><span class="meter-badge" id="meterBadge"></span></div>
    <button class="btn solid" type="submit" style="width:100%">Save expense</button>
  </form>`;
}

function wireExpenseForm(members) {
  const form = $('#expenseForm');
  const hints = {
    EQUAL: 'Amount ÷ participants. Any paisa left over goes to the first person.',
    PERCENTAGE: 'Enter each person’s percent. Must add up to 100.',
    EXACT: 'Enter each person’s exact amount. Must add up to the total.'
  };

  function drawValueCells() {
    form.querySelectorAll('.split-row').forEach(row => {
      const cell = row.querySelector('.valcell');
      if (state.splitType === 'EQUAL') cell.innerHTML = '<span class="calc"></span>';
      else cell.innerHTML = `<input type="number" step="0.01" min="0" placeholder="${state.splitType === 'PERCENTAGE' ? '%' : 'Rs'}" aria-label="value">`;
    });
    form.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === state.splitType));
    $('#segHint').textContent = hints[state.splitType];
    updateMeter();
  }

  // Live preview so the student can see the split before the server validates it
  function updateMeter() {
    const amount = parseFloat($('#expAmount').value) || 0;
    const rows = [...form.querySelectorAll('.split-row')];
    rows.forEach(r => r.classList.toggle('off', !r.querySelector('input[type=checkbox]').checked));
    const active = rows.filter(r => r.querySelector('input[type=checkbox]').checked);
    const badge = $('#meterBadge');
    let ok, text, label;

    if (state.splitType === 'EQUAL') {
      const each = active.length ? amount / active.length : 0;
      rows.forEach(r => { const c = r.querySelector('.calc'); if (c) c.textContent = r.classList.contains('off') ? '—' : money(each); });
      ok = active.length > 0 && amount > 0;
      text = `${active.length} participant${active.length === 1 ? '' : 's'}`;
      label = ok ? money(each) + ' each' : (active.length ? 'enter amount' : 'pick people');
    } else {
      const sum = active.reduce((s, r) => s + (parseFloat(r.querySelector('.valcell input').value) || 0), 0);
      const target = state.splitType === 'PERCENTAGE' ? 100 : amount;
      ok = active.length > 0 && Math.abs(sum - target) <= 0.01 && target > 0;
      const unit = (v) => state.splitType === 'PERCENTAGE' ? v.toFixed(2) + '%' : money(v);
      text = `Total ${unit(sum)} of ${unit(target)}`;
      label = ok ? 'balanced' : (sum < target ? unit(target - sum) + ' left' : unit(sum - target) + ' over');
    }
    $('#meterText').textContent = text;
    badge.textContent = label;
    badge.className = 'meter-badge ' + (ok ? 'ok' : 'bad');
  }

  form.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { state.splitType = b.dataset.type; drawValueCells(); }));
  form.addEventListener('input', updateMeter);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    // Sent even if the preview says "over": the server's InvalidSplitException returns a clean 400
    const splits = [...form.querySelectorAll('.split-row')]
      .filter(r => r.querySelector('input[type=checkbox]').checked)
      .map(r => {
        const s = { userId: Number(r.dataset.uid) };
        const input = r.querySelector('.valcell input');
        if (input) s.value = input.value === '' ? null : Number(input.value);
        return s;
      });
    const body = {
      description: $('#expDesc').value,
      amount: Number($('#expAmount').value),
      paidBy: Number($('#expPaidBy').value),
      splitType: state.splitType,
      splits
    };
    try {
      const exp = await api('POST', `/api/groups/${state.groupId}/expenses`, body);
      toast(`"${exp.description}" saved`, false, 201);
      await loadAll();
    } catch (err) { fail(err); }
  });

  drawValueCells();
}

/* ---------- expense list ---------- */
function expenseHtml(e) {
  return `<div class="exp">
    <div class="exp-top"><span class="desc">${esc(e.description)}</span><span class="num">${money(e.amount)}</span></div>
    <div class="exp-meta"><span class="badge ${esc(e.splitType)}">${esc(e.splitType)}</span>
      <span>paid by <b>${esc(e.paidBy.name)}</b></span><span>· #${e.id}</span>
      <button class="del" data-del="${e.id}" title="DELETE /api/expenses/${e.id}">delete</button></div>
    <div class="shares">${e.shares.map(s => `<span class="share">${esc(s.user.name)} ${Number(s.shareAmount).toFixed(2)}</span>`).join('')}</div>
  </div>`;
}

async function onDelete(e) {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = 'deleting…';
  try {
    await api('DELETE', `/api/expenses/${btn.dataset.del}`);
    toast('Expense deleted', false, 204);
  } catch (err) {
    fail(err);
  }
  // Always reload, so the list never shows an expense that no longer exists
  await loadAll();
}

/* ---------- balances ---------- */
function balancesHtml(balances) {
  if (!balances.length) return '<p class="empty">No members.</p>';
  const max = Math.max(1, ...balances.map(b => Math.abs(b.balance)));
  return balances.map(b => {
    const w = (Math.abs(b.balance) / max * 100).toFixed(1);
    const cls = b.balance > 0.009 ? 'gets' : b.balance < -0.009 ? 'owes' : 'zero';
    return `<div class="bal" title="${esc(b.status)}">
      <span class="name">${esc(b.name)}</span>
      <span class="neg">${cls === 'owes' ? `<span class="bar" style="width:${w}%"></span>` : ''}</span>
      <span class="pos">${cls === 'gets' ? `<span class="bar" style="width:${w}%"></span>` : ''}</span>
      <span class="amt ${cls}">${b.balance > 0 ? '+' : ''}${Number(b.balance).toFixed(2)}</span></div>`;
  }).join('') + '<div class="bal-legend"><span>← owes</span><span>gets back →</span></div>';
}

/* ---------- settlements ---------- */
function settlementHtml(settlements, balances) {
  const people = balances.filter(b => Math.abs(b.balance) > 0.009).length;
  if (!settlements.length) {
    return `<div class="receipt"><div class="r-head">SETTLEMENT SLIP</div>
      <p class="empty" style="text-align:center;margin:10px 0">Everyone is square.</p><span class="stamp">SETTLED</span></div>`;
  }
  return `<div class="receipt">
    <div class="r-head">SETTLEMENT SLIP · GREEDY · TWO HEAPS</div>
    ${settlements.map(s => `<div class="r-line" data-from="${s.fromUserId}" data-to="${s.toUserId}" data-amt="${s.amount}"
          data-from-name="${esc(s.fromUser)}" data-to-name="${esc(s.toUser)}">
        <span class="who-pays">${esc(s.fromUser)}<span class="arrow">→</span>${esc(s.toUser)}</span>
        <span class="r-amt">${money(s.amount)}</span>
        <button class="settle-btn" data-settle title="POST /api/groups/${state.groupId}/payments">Settle</button></div>`).join('')}
    <div class="r-foot"><span>${settlements.length} payment${settlements.length === 1 ? '' : 's'}</span><span>${people} people unsettled · max ${Math.max(people - 1, 0)} needed</span></div>
  </div>`;
}

/* ---------- settle-up payments ---------- */
function paymentsHtml(payments) {
  if (!payments.length) return '';
  return `<div class="paid-list"><div class="eyebrow">Payments recorded</div>
    ${payments.map(p => `<div class="paid">
      <span>${esc(p.fromUser.name)} paid ${esc(p.toUser.name)}</span>
      <span class="num">${money(p.amount)}</span>
      <button class="del" data-undo="${p.id}" title="DELETE /api/payments/${p.id}">undo</button></div>`).join('')}
  </div>`;
}

// Turns a slip line into a small form: the amount is pre-filled but can be lowered for a partial payment
function openPayForm(e) {
  const line = e.currentTarget.closest('.r-line');
  const d = line.dataset;
  const form = document.createElement('form');
  form.className = 'pay-form';
  form.innerHTML = `<span class="who-pays"><b>${esc(d.fromName)}</b> pays <b>${esc(d.toName)}</b></span>
    <input type="number" min="0.01" max="${d.amt}" step="0.01" value="${Number(d.amt).toFixed(2)}" aria-label="Amount paid" required>
    <button class="settle-btn" type="submit">Mark paid</button>
    <button class="chip-btn" type="button" data-cancel>Cancel</button>
    <span class="hint">Change the amount for a partial payment.</span>`;
  line.replaceWith(form);
  form.querySelector('input').select();
  form.querySelector('[data-cancel]').addEventListener('click', () => form.replaceWith(line));
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const amount = Number(form.querySelector('input').value);
    form.querySelector('[type=submit]').disabled = true;
    try {
      await api('POST', `/api/groups/${state.groupId}/payments`,
        { fromUserId: Number(d.from), toUserId: Number(d.to), amount });
      await loadAll();
      // Tell the user what is left after this payment
      const left = (state.balances || []).find(b => b.userId === Number(d.from));
      const rest = left && left.balance < -0.009 ? `${d.fromName} still owes ${money(-left.balance)}` : `${d.fromName} is settled up`;
      toast(`Recorded ${money(amount)} to ${d.toName}. ${rest}.`, false, 201);
    } catch (err) {
      fail(err);
      await loadAll();
    }
  });
}

async function onUndoPayment(e) {
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    await api('DELETE', `/api/payments/${btn.dataset.undo}`);
    toast('Payment undone', false, 204);
  } catch (err) { fail(err); }
  await loadAll();
}

/* ===================== demo data (all via the REST API) ===================== */
async function loadDemo() {
  const btn = $('#demoBtn');
  btn.disabled = true;
  try {
    const people = [['Aman', 'aman@demo.com'], ['Bhavya', 'bhavya@demo.com'], ['Chirag', 'chirag@demo.com'], ['Diya', 'diya@demo.com']];
    const existing = await api('GET', '/api/users');
    const ids = [];
    for (const [name, email] of people) {
      const found = existing.find(u => u.email === email);
      ids.push(found ? found.id : (await api('POST', '/api/users', { name, email })).id);
    }
    const [a, b, c, d] = ids;
    const g = await api('POST', '/api/groups', { name: 'Goa Trip' });
    for (const id of ids) await api('POST', `/api/groups/${g.id}/members/${id}`);

    await api('POST', `/api/groups/${g.id}/expenses`, { description: 'Dinner', amount: 1200, paidBy: a, splitType: 'EQUAL',
      splits: [{ userId: a }, { userId: b }, { userId: c }, { userId: d }] });
    await api('POST', `/api/groups/${g.id}/expenses`, { description: 'Cab to airport', amount: 1000, paidBy: b, splitType: 'PERCENTAGE',
      splits: [{ userId: a, value: 25 }, { userId: b, value: 25 }, { userId: c, value: 30 }, { userId: d, value: 20 }] });
    await api('POST', `/api/groups/${g.id}/expenses`, { description: 'Movie tickets', amount: 1000, paidBy: c, splitType: 'EXACT',
      splits: [{ userId: a, value: 250 }, { userId: b, value: 300 }, { userId: c, value: 200 }, { userId: d, value: 250 }] });

    state.groupId = g.id;
    toast('Demo loaded: 4 people, 1 group, 3 expenses');
    await loadAll();
  } catch (err) { fail(err); }
  btn.disabled = false;
}
$('#demoBtn').addEventListener('click', loadDemo);

/* ===================== misc ===================== */
$('#clearLog').addEventListener('click', () => $('#logBody').innerHTML = '');
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('es-theme', root.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem('es-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

loadAll().catch(fail);
</script>
</body>
